name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug-APK (test-advertenties, direct te installeren)
        run: ./gradlew assembleDebug

      - name: Upload-sleutel klaarzetten
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-key.jks
          cat > keystore.properties <<PROPS
          storeFile=upload-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Release-bundle (AAB) voor de Play Store
        env:
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ORG_GRADLE_PROJECT_ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: pijltjes-weg
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
